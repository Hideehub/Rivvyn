{% extends 'base.html' %}
{% block title %}Log in - Rivyn{% endblock %}
{% block content %}
<div class="rivyn-auth-wrap">
    <div class="rivyn-card">
        <h2>Log in</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100 mt-2">Log in</button>
        </form>
        <p class="mt-3 mb-0 text-center">
            <a href="{% url 'signup' %}">Need an account? Sign up</a>
        </p>
    </div>
</div>
{% endblock %}
