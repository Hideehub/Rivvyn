{% extends 'base.html' %}
{% block title %}Log in - Rivyn{% endblock %}
{% block content %}
<h2>Log in</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Log in</button>
</form>
<p class="mt-3"><a href="{% url 'signup' %}">Need an account? Sign up</a></p>
{% endblock %}
