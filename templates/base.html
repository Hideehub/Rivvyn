{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Rivyn{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/rivyn.css' %}" rel="stylesheet">
</head>
<body>
<div class="rivyn-bg-fx" aria-hidden="true"></div>
<nav class="navbar navbar-expand-lg rivyn-navbar mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}">Rivyn</a>
        {% if user.is_authenticated %}
        <div class="d-flex align-items-center">
            <span class="navbar-text-user me-3">
                <strong>{{ user.username }}</strong><span class="rivyn-role-pill">{{ user.get_role_display }}</span>
            </span>
            <form method="post" action="{% url 'logout' %}" class="m-0">
                {% csrf_token %}
                <button class="btn btn-outline-light btn-sm" type="submit">Log out</button>
            </form>
        </div>
        {% endif %}
    </div>
</nav>
<div class="container">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
