{% extends 'base.html' %}
{% block title %}Sign up - Rivyn{% endblock %}
{% block content %}
<div class="rivyn-auth-wrap">
    <div class="rivyn-card">
        <h2>Create your account</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100 mt-2">Sign up</button>
        </form>
        <p class="mt-3 mb-0 text-center">
            <a href="{% url 'login' %}">Already have an account? Log in</a>
        </p>
    </div>
</div>
{% endblock %}
