{% extends 'base.html' %}
{% block title %}Sign up - Rivyn{% endblock %}
{% block content %}
<h2>Sign up</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Sign up</button>
</form>
<p class="mt-3"><a href="{% url 'login' %}">Already have an account? Log in</a></p>
{% endblock %}
